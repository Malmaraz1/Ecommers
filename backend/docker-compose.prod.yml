services:
  

  mysql8:
    image: mysql:8
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - data-mysql:/var/lib/mysql
    restart: always
    networks:
      - spring
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres14:
    image: postgres:14-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - data-postgres:/var/lib/postgresql/data
    restart: always
    networks:
      - spring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    env_file: .env
    
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBIT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit vm_memory_high_watermark 0.6
    networks:
      - spring
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-principal:
    image: ${DOCKERHUB_USERNAME}/ecommerce-api-principal:latest
    build:
      context: ./api-Principal
      dockerfile: Dockerfile
    pull_policy: build
    expose:
      - "8001"
    env_file:
      - .env
    networks:
      - spring
    depends_on:
      mysql8:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      servidor-stock:
        condition: service_healthy
    restart: always
    environment:
      - API_KEY=${API_KEY}
      - STRIPE_API_KEY=${STRIPE_SECRET_KEY}
      - SERVER_PORT=${PORT_API_PRINCIPAL}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - APP_FRONTEND_URL=${APP_FRONTEND_URL}
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_MYSQL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME_MYSQL}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD_MYSQL}
      - SERVIDOR_STOCK_URL=${SERVIDOR_STOCK_URL}
      - SPRING_RABBITMQ_HOST=${RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${RABBIT_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      

  servidor-stock:
    image: ${DOCKERHUB_USERNAME}/ecommerce-servicio-stock:latest
    build:
      context: ./servicio-control-stock
      dockerfile: Dockerfile
    pull_policy: build
    expose:
      - "8002"
    env_file:
      - .env
    networks:
      - spring
    depends_on:
      postgres14:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'nc -z localhost 8002' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      - SERVER_PORT=${PORT_SERVICIO_STOCK}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_POSTGRES}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME_POSTGRES}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD_POSTGRES}
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - SPRINGDOC_SWAGGER_UI_CONFIG_URL=/stock/v3/api-docs/swagger-config
      - SPRINGDOC_SWAGGER_UI_URL=/stock/v3/api-docs
      - SPRINGDOC_API_DOCS_PATH=/v3/api-docs
      - SPRING_RABBITMQ_HOST=${RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${RABBIT_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
  watchtower:
    image: containrrr/watchtower
    
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 --cleanup --include-stopped
    restart: always
  nginx:
    image: nginx:alpine
  
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - servidor-stock
      - api-principal
    networks:
      - spring

  prometheus:
    image: prom/prometheus:latest
   
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro  
    networks:
      - spring 
  grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - data-grafana:/var/lib/grafana
    networks:
      - spring     

volumes:
  data-mysql:
  data-postgres:
  data-grafana: 
networks:
  spring:
