version: "3.9"

services:
  # --- INFRAESTRUCTURA ---
  mysql8:
    image: mysql:8
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - data-mysql:/var/lib/mysql
    restart: always
    networks:
      - spring

  postgres14:
    image: postgres:14-alpine
    ports:
      - "5532:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB} 
    volumes:
      - data-postgres:/var/lib/postgresql/data
    restart: always
    networks:
      - spring

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-ecommerce
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit vm_memory_high_watermark 0.6
    networks:
      - spring
    restart: always  

  redis: # Agregado para tu carrito pro
    image: redis:7-alpine
    container_name: redis-cache
    restart: always
    networks:
      - spring
    deploy:
      resources:
        limits:
          memory: 100M # Redis es muy liviano

  # --- MICROSERVICIOS ---
  api-principal:
    build:
      context: ./api-Principal
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file: ./api-Principal/.env
    networks:
      - spring
    depends_on:
      - mysql8
      - servidor-stock
      - rabbitmq
      - redis
    restart: always
    environment:
      - JAVA_OPTS=-Xmx256m -Xms128m
    # EL DEPLOY VA AQUÍ DENTRO
    deploy:
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 128M

  servidor-stock:
    build:
      context: ./servicio-control-stock
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - ./servicio-control-stock/.env
    networks:
      - spring
    depends_on:
      - postgres14
      - rabbitmq
    restart: always
    environment:
      - JAVA_OPTS=-Xmx256m -Xms128m
    # Y AQUÍ TAMBIÉN
    deploy:
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 128M

volumes:
  data-mysql:    
  data-postgres: 

networks:
  spring:

