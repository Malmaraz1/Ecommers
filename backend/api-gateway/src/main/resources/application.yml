server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        # Ruta para el Microservicio Principal
        - id: api-principal-route
          uri: uri:http://api-principal:8001
          predicates:
            - Path=/api/orders/**, /api/users/**

        # Ruta para el Microservicio de Stock
        - id: stock-service-route
          uri: http://servidor-stock:8002
          predicates:
            - Path=/api/stock/**