events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain application/json application/xml text/css;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Definición de Upstreams (Microservicios internos)
    upstream api_principal {
        server api-principal:8001;
    }

    upstream api_stock {
        server servidor-stock:8002;
    }

    server {
        listen 80;
        server_name localhost;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Cabeceras estándar heredadas por todas las locations
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ==========================================
        # SWAGGER - API PRINCIPAL
        # ==========================================
        location /swagger-ui/ {
            proxy_pass http://api_principal/swagger-ui/;
        }

        location /v3/api-docs {
            proxy_pass http://api_principal/v3/api-docs;
        }

        # ==========================================
        # SWAGGER - SERVICIO STOCK
        # ==========================================
       location /stock/swagger-ui/ {
            proxy_pass http://api_stock/swagger-ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Forwarded-Prefix /stock;

            # Buffers para soportar la carga de bundles JS pesados (1.5MB)
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        location /stock/v3/api-docs {
            proxy_pass http://api_stock/v3/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Forwarded-Prefix /stock;
        }

        # ==========================================
        # ENDPOINTS DE NEGOCIO
        # ==========================================
        location /api/v1/stock/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_stock/stock/;
        }

        location /api/v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_principal/;
        }

        # Endpoint de salud de Nginx
        location /health {
            return 200 '{"status":"UP", "gateway":"nginx"}';
            add_header Content-Type application/json;
        }
    }
}