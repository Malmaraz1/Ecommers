version: "3.9"

services:

  mysql8:
    image: mysql:8
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - data-mysql:/var/lib/mysql
    restart: always
    networks:
      - spring

  postgres14:
    image: postgres:14-alpine
    ports:
      - "5532:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB} 
    volumes:
      - data-postgres:/var/lib/postgresql/data
    restart: always
    networks:
      - spring

  rabbitmq:
    image: rabbitmq:3-management
    env_file: .env
    container_name: rabbitmq-ecommerce
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABIT_USER} 
      - RABBITMQ_DEFAULT_PASS=${RABIT_PASSWORD}
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit vm_memory_high_watermark 0.6
    networks:
      - spring
    restart: always  

  


  api-principal:
    build:
      context: ./api-Principal
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file: ./api-Principal/.env
    networks:
      - spring
    depends_on:
      - mysql8
      - servidor-stock
      - rabbitmq
      
    restart: always
    environment:
      - JAVA_OPTS=-Xmx256m -Xms128m

    deploy:
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 128M

  servicio-control-stock:
    build:
      context: ./servicio-control-stock
      dockerfile: Dockerfile
    ports:
      - "8002"
    env_file:
      - ./servicio-control-stock/.env
    networks:
      - spring
    depends_on:
      - postgres14
      - rabbitmq
    restart: always
    environment:
      - JAVA_OPTS=-Xmx256m -Xms128m
  
    deploy:
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 128M

volumes:
  data-mysql:    
  data-postgres: 

networks:
  spring:

