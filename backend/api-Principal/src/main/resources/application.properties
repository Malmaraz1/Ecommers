server.port=${PORT:8001}
spring.profiles.active=desarrollo
spring.application.name=ecommerce

# Base de datos (Usará los valores del launch.json)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

servidor.stock.url=${SERVIDOR_STOCK_URL}


stripe.api.key=${STRIPE_SECRET_KEY}
stipe.api.key.public=${STRIPE_PUBLIC_KEY}
app.frontend.url=${URL_FRONT_PAGO}
logging.level.org.springframework.cloud.openfeign=DEBUG

logging.level.com.tu.paquete.StockClientRest=DEBUG
spring.data.web.pageable.serialization-mode=via-dto
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
logging.level.org.springframework.amqp=DEBUG
logging.level.org.springframework.rabbit=DEBUG
# 1. Si el mensaje falla, NO lo vuelvas a meter en la cola (fundamental para salir del loop)
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# 2. Configura reintentos para que no sea infinito
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3

# 3. Opcional: ver más detalle si sigue fallando
logging.level.org.springframework.amqp.rabbit.listener=DEBUG
