name: CI - API Principal

# Se ejecuta en cada Push o Pull Request hacia la rama main
on:
  push:
    branches: ["main", "develop"]
    paths:
      - "backend/api-Principal/**" # Solo se dispara si tocaste código de este servicio
      - ".github/workflows/**"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "backend/api-Principal/**"

jobs:
  test:
    name: Run Unit Tests 
    runs-on: ubuntu-latest # Corre en una máquina virtual de Ubuntu nativa

    defaults:
      run:
        working-directory: ./backend/api-Principal

    steps:
      # 1. Clonar el repositorio
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configurar Java 17 con caché de dependencias Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Run Tests
      # 3. Dar permisos de ejecución al wrapper de Maven
    
          # 4. Ejecutar las pruebas unitarias
        run: |
          chmod +x mvnw
          ./mvnw clean test

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/api-Principal
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-api-principal:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-api-principal:${{ github.sha }}
