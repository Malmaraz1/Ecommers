name: CI - API Principal

# Se ejecuta en cada Push o Pull Request hacia la rama main
on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "api-Principal/**"       # Solo se dispara si tocaste código de este servicio
      - ".github/workflows/**"
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit Tests & Build Artifact
    runs-on: ubuntu-latest       # Corre en una máquina virtual de Ubuntu nativa

    defaults:
      run:
        working-directory: ./api-Principal

    steps:
      # 1. Clonar el repositorio
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configurar Java 17 con caché de dependencias Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Dar permisos de ejecución al wrapper de Maven
      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      # 4. Ejecutar las pruebas unitarias
      - name: Run Tests
        run: ./mvnw clean test