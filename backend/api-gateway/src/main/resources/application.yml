server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: api-principal-route
          uri: http://localhost:8001
          predicates:
            # Agregamos v3/api-docs para que el Gateway pueda leer la definición de Swagger
            - Path=/login/**, /carritos/**, /categorias/**, /pedidos/**, /productos/**, /usuarios/**, /api/payments/**
          

        - id: stock-service-route
          uri: http://localhost:8002
          predicates:
            - Path=/stock/**, /deposito/**
          

